<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="manifest" href="/manifest.json">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YallaBuy Project OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM
============================================================ */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#f1efea; --border:#e4e0d8; --border2:#d5d0c5;
  --ink:#1d1c1a; --muted:#6f6b62; --faint:#a09b90;
  --orange:#e35718; --orange-ink:#c24608; --orange-soft:#fdeee5; --orange-line:#f3c9ae;
  --ok-ink:#1e7a3f; --ok-soft:#e4f3e8; --warn-ink:#9a6200; --warn-soft:#fbf1da;
  --bad-ink:#b3261e; --bad-soft:#fbe9e7; --info-ink:#1d5f8a; --info-soft:#e3eef6;
  --shadow:0 8px 32px rgba(28,26,22,.14);
  --r:10px; --rs:7px;
  --font:'IBM Plex Sans',sans-serif; --disp:'Sora',sans-serif; --mono:'IBM Plex Mono',monospace;
}
html[data-theme="dark"]{
  --bg:#17181b; --surface:#1f2125; --surface2:#26282d; --border:#32353b; --border2:#3e4249;
  --ink:#e9e6e0; --muted:#a29d93; --faint:#6e6a62;
  --orange:#f0703a; --orange-ink:#f58a5e; --orange-soft:#33231a; --orange-line:#4d2f1d;
  --ok-ink:#6fca8d; --ok-soft:#1c2b21; --warn-ink:#dcb35e; --warn-soft:#2d2517;
  --bad-ink:#ef7b72; --bad-soft:#301d1b; --info-ink:#7db4da; --info-soft:#1a252e;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.01em}
a{color:var(--orange-ink)}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:13.5px;color:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--bg)}
.mono{font-family:var(--mono)}
.micro{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:transform .18s ease}
.main{flex:1;margin-left:236px;min-width:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--orange);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;flex-shrink:0}
.brand-name{font-family:var(--disp);font-weight:700;font-size:14.5px;line-height:1.15}
.brand-name small{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav-group{margin-top:14px}
.nav-label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);padding:0 10px 5px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--rs);color:var(--muted);
  text-decoration:none;font-weight:500;font-size:13.5px;position:relative}
.nav a svg{width:16px;height:16px;flex-shrink:0}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.active{background:var(--orange-soft);color:var(--orange-ink)}
.nav a.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.side-foot{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px}

.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:58px}
.view{padding:24px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700}
.page-head p{color:var(--muted);margin-top:2px;max-width:640px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-ink);border-color:var(--orange-ink)}
html[data-theme="dark"] .btn-primary:hover{background:#d95f27}
.btn-danger{color:var(--bad-ink);border-color:var(--bad-ink)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface2);color:var(--ink)}
.btn-sm{padding:4px 10px;font-size:12px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--rs);border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;
  background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.badge.tone-orange{background:var(--orange-soft);color:var(--orange-ink);border-color:var(--orange-line)}
.badge.tone-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:transparent}
.badge.tone-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.badge.tone-bad{background:var(--bad-soft);color:var(--bad-ink);border-color:transparent}
.badge.tone-info{background:var(--info-soft);color:var(--info-ink);border-color:transparent}
.badge.tone-ink{background:var(--ink);color:var(--bg);border-color:transparent}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:13.5px;font-weight:700}
.card-body{padding:16px}
.pbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .25s}
.pbar.p-ok>span{background:var(--ok-ink)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--orange-soft)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .span2{grid-column:1/-1}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search-inline{position:relative;flex:1;min-width:180px}
.toolbar .search-inline input{width:100%;padding:8px 10px 8px 32px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs)}
.toolbar .search-inline svg{position:absolute;left:9px;top:9px;width:15px;height:15px;color:var(--faint)}
.toolbar select{padding:7px 9px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);max-width:170px}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface2)}
td.t-title{font-weight:600;max-width:340px}
td .sub{display:block;font-weight:400;font-size:11.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.due-over{color:var(--bad-ink);font-weight:600}
@media(max-width:640px){
  table{min-width:0}
  thead{display:none}
  tr{display:block;border-bottom:1px solid var(--border);padding:6px 0}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:5px 14px}
  td::before{content:attr(data-label);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  td.t-title{flex-direction:column;align-items:flex-start;gap:2px}
  td.t-title::before{margin-bottom:2px}
}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.stat b{display:block;font-family:var(--disp);font-size:23px;font-weight:700;margin-top:2px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}

/* focus panel */
.focus-panel{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden}
html[data-theme="dark"] .focus-panel{background:#111214;color:#e9e6e0}
.focus-panel .micro{color:var(--orange)}
.focus-panel h2{font-size:clamp(19px,2.6vw,27px);font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.focus-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;align-items:center}
.focus-meta .fm{font-family:var(--mono);font-size:11.5px;opacity:.75}
.focus-panel .pbar{background:rgba(255,255,255,.16);margin-top:16px}
.focus-panel .pbar span{background:var(--orange)}
.focus-side{position:absolute;right:26px;top:50%;transform:translateY(-50%);text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.focus-side .pct{font-family:var(--disp);font-weight:800;font-size:34px;color:var(--orange)}
@media(max-width:700px){.focus-side{position:static;transform:none;flex-direction:row;margin-top:14px;align-items:center}}

.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
@media(max-width:960px){.dash-grid{grid-template-columns:1fr}}
.prio-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1100px){.prio-cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.prio-cols{grid-template-columns:1fr}}
.prio-col .micro{display:block;padding:8px 10px 6px}
.prio-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;margin-bottom:8px;cursor:pointer}
.prio-item:hover{border-color:var(--border2);background:var(--surface2)}
.prio-item b{display:block;font-size:12.5px;font-weight:600}
.prio-item span{font-size:11px;color:var(--faint)}
.act-item{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.act-item:last-child{border-bottom:none}
.act-dot{width:7px;height:7px;border-radius:99px;background:var(--orange);margin-top:6px;flex-shrink:0}
.act-item time{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}

.proj-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.proj-row:last-child{border-bottom:none}
.proj-row:hover{background:var(--surface2)}
.proj-row .pr-name{font-weight:600;flex:1;min-width:120px}
.proj-row .pr-name small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.proj-row .pbar{width:130px;flex-shrink:0}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media(max-width:900px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kanban{grid-template-columns:1fr}}
.kb-col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px;min-height:120px}
.kb-col.drag-over{outline:2px dashed var(--orange);outline-offset:-2px}
.kb-col .kb-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 8px}
.kb-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 11px;margin-bottom:8px;cursor:grab}
.kb-card:hover{border-color:var(--border2)}
.kb-card:active{cursor:grabbing}
.kb-card b{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
.kb-card .kb-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:8px 14px;border:none;background:none;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--orange-ink);border-bottom-color:var(--orange)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 16px;overflow-y:auto;animation:fadeIn .12s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:620px;box-shadow:var(--shadow);animation:slideUp .14s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.modal.wide{max-width:760px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:13px}
.dl dt{color:var(--faint);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding-top:2px}
.dl dd{min-width:0;overflow-wrap:break-word}
.rel-group{margin-top:8px}
.rel-group .micro{display:block;margin-bottom:6px}
.rel-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;font-size:12.5px}
.rel-item:hover{background:var(--surface2)}
.rel-item svg{width:13px;height:13px;color:var(--faint);flex-shrink:0}
.check-line{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.check-line.done{color:var(--faint);text-decoration:line-through}
.check-line input{accent-color:var(--orange);width:15px;height:15px}
.score-ring{font-family:var(--disp);font-weight:800;font-size:22px}

/* search dropdown + results */
.gsearch{position:relative;flex:1;max-width:440px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface)}
.gsearch>svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
.gsearch kbd{position:absolute;right:9px;top:8px;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--border2);border-radius:4px;padding:1px 5px}
.gs-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);max-height:420px;overflow-y:auto;z-index:90}
.gs-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.gs-item:last-child{border-bottom:none}
.gs-item:hover{background:var(--surface2)}
.gs-item .gst{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);width:74px;flex-shrink:0}
.gs-item b{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* quick add menu */
.qa-wrap{position:relative}
.qa-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:200px;z-index:90;padding:5px}
.qa-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border:none;background:none;text-align:left;border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--ink)}
.qa-menu button:hover{background:var(--orange-soft);color:var(--orange-ink)}
.qa-menu button svg{width:15px;height:15px;color:var(--faint)}
.qa-menu button:hover svg{color:var(--orange-ink)}

/* toast */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 40px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:slideUp .16s ease}
.toast.err{background:var(--bad-ink);color:#fff}
.toast.ok::before{content:"";width:8px;height:8px;border-radius:99px;background:#5ad188;flex-shrink:0}
.toast.err::before{content:"";width:8px;height:8px;border-radius:99px;background:#ffd3cf;flex-shrink:0}

/* empty state */
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty svg{width:36px;height:36px;color:var(--faint);margin-bottom:12px}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:13px;margin-bottom:16px}

.backdrop-dim{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:55;display:none}
.scrim-show{display:block}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ftag{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);cursor:pointer}
.ftag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.review-block{margin-bottom:12px}
.review-block label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:4px}
.review-block textarea{width:100%;min-height:58px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;resize:vertical}
.horizon-tabs{display:flex;gap:8px;margin-bottom:14px}
.goal-card{padding:14px 16px;border-bottom:1px solid var(--border)}
.goal-card:last-child{border-bottom:none}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.goal-top b{font-size:13.5px}
.goal-meta{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--faint);margin-top:7px;flex-wrap:wrap}

/* ============ RESPONSIVE SHELL ============ */
.menu-btn{display:none}
@media(max-width:920px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .menu-btn{display:inline-grid}
  .view{padding:16px 14px}
  .topbar{padding:10px 14px}
  .gsearch kbd{display:none}
  .form-grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Y</div>
      <div class="brand-name">YallaBuy<small>Project OS</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn btn-ghost btn-sm" data-action="theme" id="theme-btn" style="flex:1;justify-content:center"></button>

/* ================================================================
   2. STORAGE
================================================================ */
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast("Could not save data (storage full or blocked).", "err"); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){ state = seedData(); saveState(); return; }
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.projects)) throw new Error("bad shape");
    state = parsed;
    // guarantee every collection exists
    ["projects","tasks","ideas","content","features","seo","bugs","notes","research","goals","decisions","reviews","activity","tags"].forEach(k=>{
      if(!Array.isArray(state[k])) state[k] = [];
    });
    if(!state.settings) state.settings = {};
  }catch(e){
    state = seedData();
    try{ saveState(); }catch(_){}
    setTimeout(()=>toast("Stored data was corrupted — restored demo data.","err"), 400);
  }
}

const $  = s => document.querySelector(s);
const byId = (coll, id) => (state[coll]||[]).find(x => x.id === id) || null;
const nameOf = (coll, id) => { const o = byId(coll, id); return o ? (o.title || o.name || "—") : "—"; };
const projLabel = id => { const p = byId("projects", id); return p ? (p.name || p.title) : null; };
function fmtDate(ts){
  if(!ts) return "—";
  const d = new Date(ts); if(isNaN(d)) return "—";
  return d.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
}
function timeAgo(ts){
  if(!ts) return "";
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<604800) return Math.floor(s/86400)+"d ago";
  return fmtDate(ts);
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
const PRIOS = ["Critical","High","Medium","Low"];
const PRIO_W = {Critical:0, High:1, Medium:2, Low:3};
function toneFor(s){
  const t = String(s||"").toLowerCase();
  if(/(done|published|resolved|completed|released|accepted|active|closed|ready|good)/.test(t)) return "ok";
  if(/(critical|high|open|missing|broken|needs update|investigating|fixing|rejected|cancelled|slow|lcp|cls)/.test(t)) return /critical|broken|missing/.test(t) ? "bad" : "warn";
  if(/(in progress|writing|building|researching|evaluating|testing|review|editing|planned|planning|todo|proposed)/.test(t)) return "orange";
  if(/(medium|partial|pending|paused|superseded)/.test(t)) return "warn";
  if(/(low|backlog|inbox|idea|archived|none)/.test(t)) return "";
  return "info";
}

  if(id){
    const item = byId(coll, id);
    if(!item){ toast("Item no longer exists.","err"); return null; }
    ["status","priority","severity"].forEach(f=>{
      if(data[f] && item[f] && data[f] !== item[f]) logAct("Status changed","SCHEMAS"&&coll, `${item.title||item.name}: ${item[f]} → ${data[f]}`);
    });
    Object.assign(item, data, {updatedAt:now});
    logAct("Updated", coll, item.title || item.name);
    saveState(); toast("Saved.");
    return item;
  }
  const item = Object.assign({id:uid(coll.slice(0,2)), createdAt:now, updatedAt:now}, data);
  state[coll].unshift(item);
  logAct("Created", coll, item.title || item.name);
  saveState(); toast((SCHEMAS[coll].singular) + " created.");
  return item;
}
function deleteItem(coll, id){
  const item = byId(coll, id);
  if(!item) return;
  confirmDlg(`Delete this ${SCHEMAS[coll].singular.toLowerCase()}?`, `"${item.title||item.name}" will be permanently removed. Related records keep working but lose this link.`, ()=>{
    state[coll] = state[coll].filter(x=>x.id!==id);
    logAct("Deleted", coll, item.title || item.name);
    saveState(); toast("Deleted.");
    closeModal(); rerender();
  });
}
/* Priority heuristic — normalized 0–100. A productivity hint, not magic. */
function ideaScore(i){
  const e = Math.max(1, Number(i.effort)||1);
  return Math.round(((Number(i.impact)||0)+(Number(i.importance)||0)+(Number(i.urgency)||0)) / e / 15 * 100);
}
function scoreBadge(i){
  const s = ideaScore(i);
  const tone = s>=75?"tone-bad":s>=55?"tone-orange":s>=35?"tone-warn":"";
  const sug = s>=75?"Critical":s>=55?"High":s>=35?"Medium":"Low";
  return `<span class="badge ${tone}" title="Suggested priority: ${sug} — (Impact+Importance+Urgency)/Effort heuristic"><span class="score-ring" style="font-size:12px">${s}</span>&nbsp;· ${sug}</span>`;
}

function fieldHTML(f, val){

    case "date": ctrl = `<input id="${id}" type="date" value="${esc(val? String(val).slice(0,10):"")}">`; break;

    case "tags": ctrl = `<input id="${id}" type="text" value="${esc(Array.isArray(val)?val.join(", "):(val??""))}" placeholder="comma, separated">`; break;
    case "sel": ctrl = `<select id="${id}">${optionsFor(f,val)}</select>`; break;
    case "proj": case "ref": ctrl = `<select id="${id}">${optionsFor(f,val)}</select>`; break;

/* ================================================================
   10. GENERIC COLLECTION VIEW
================================================================ */
function getFilters(coll){
  if(!ui.filters[coll]) ui.filters[coll] = {q:"", status:"", prio:"", proj:"", kind:""};
  return ui.filters[coll];
}
function applyFilters(coll, items){
  const f = getFilters(coll);
  return items.filter(it=>{
    if(f.q){ const hay = JSON.stringify(Object.values(it)).toLowerCase(); if(!hay.includes(f.q.toLowerCase())) return false; }
    if(f.status && (it.status||it.severity) !== f.status) return false;
    if(f.prio && (it.priority||it.severity) !== f.prio) return false;
    if(f.proj && it.projectId !== f.proj) return false;
    if(f.kind && it.kind !== f.kind) return false;
    return true;
  });
}
function sortItems(coll, items){
  const sch = SCHEMAS[coll];
  return [...items].sort((a,b)=>{
    if(sch.prioField){
      const pa = PRIO_W[a[sch.prioField]] ?? 9, pb = PRIO_W[b[sch.prioField]] ?? 9;
      if(pa !== pb) return pa - pb;
    }
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
}
function cellHTML(coll, col, it){
  const sch = SCHEMAS[coll];
  if(col.t === "proj"){ const p = projLabel(it.projectId); return p ? `<span class="badge tone-info">${esc(p)}</span>` : `<span style="color:var(--faint)">—</span>`; }
  if(col.t === "pbar") return `<div style="display:flex;align-items:center;gap:8px;min-width:110px">${pbar(it[col.k])}<span class="mono" style="font-size:11px">${Number(it[col.k])||0}%</span></div>`;
  if(col.t === "date") return `<span class="mono" style="font-size:12px">${fmtDate(it[col.k])}</span>`;
  if(col.t === "due"){
    if(!it.dueDate) return `<span style="color:var(--faint)">—</span>`;
    const over = it.dueDate && new Date(it.dueDate) < new Date(new Date().toDateString()) && !["Done","Cancelled"].includes(it.status);
    return `<span class="mono ${over?"due-over":""}" style="font-size:12px">${fmtDate(it.dueDate)}${over?" !":""}</span>`;
  }
  if(col.t === "tags") return (it.tags||[]).slice(0,3).map(t=>`<span class="badge">${esc(t)}</span>`).join(" ") || "—";
  if(col.t === "kind"){ const o = OPT.seoKind.find(k=>k[0]===it.kind); return badge(o?o[1]:it.kind); }
  if(col.t === "trim") return `<span style="color:var(--muted);display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(String(it[col.k]||"—"))}</span>`;
  if(col.t === "score") return scoreBadge(it);
  if(col.title) return `<b>${esc(it[col.k])}</b>${it.description?`<span class="sub">${esc(String(it.description).slice(0,70))}</span>`:""}`;
  const v = it[col.k];
  if(["status","priority","severity","category","type","horizon"].includes(col.k)) return badge(v);
  return esc(v ?? "—");
}
function collectionBody(coll){
  const sch = SCHEMAS[coll];
  const f = getFilters(coll);
  const items = sortItems(coll, applyFilters(coll, state[coll]));
  if(!state[coll].length)
    return emptyState(sch.icon, `No ${sch.label.toLowerCase()} yet`, sch.intro || `Create your first ${sch.singular.toLowerCase()}.`, `+ Add ${sch.singular}`, coll);
  if(!items.length)
    return emptyState(sch.icon, "Nothing matches your filters", "Try clearing the search or filters.", null);
  return `<div class="table-wrap"><table>
    <thead><tr>${sch.cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}</tr></thead>
    <tbody>${items.map(it=>`<tr data-action="view" data-ref="${coll}:${it.id}" tabindex="0" role="button" aria-label="Open ${esc(it.title||it.name)}">
      ${sch.cols.map(c=>`<td class="${c.title?"t-title":""}" data-label="${esc(c.l)}">${cellHTML(coll,c,it)}</td>`).join("")}
    </tr>`).join("")}</tbody></table></div>
    <p class="micro" style="margin-top:10px">${items.length} of ${state[coll].length} shown</p>`;

function filterBar(coll, opts){

function currentFocus(){
  const open = state.tasks.filter(t=>["In Progress","Todo","Review"].includes(t.status));
  if(!open.length) return null;
  open.sort((a,b)=>{
    const sa = a.status==="In Progress"?0:a.status==="Review"?1:2, sb = b.status==="In Progress"?0:b.status==="Review"?1:2;
    if(sa!==sb) return sa-sb;
    const pa = PRIO_W[a.priority]??9, pb = PRIO_W[b.priority]??9;
    if(pa!==pb) return pa-pb;
    return (a.dueDate?new Date(a.dueDate):Infinity) - (b.dueDate?new Date(b.dueDate):Infinity);
  });
  return open[0];
}

document.addEventListener("dragstart", e=>{

document.addEventListener("dragover", e=>{

});
document.addEventListener("dragleave", e=>{
  const col = e.target.closest(".kb-col");
  if(col && !col.contains(e.relatedTarget)) col.classList.remove("drag-over");
});
document.addEventListener("drop", e=>{
  const col = e.target.closest(".kb-col");
  if(!col) return;
  e.preventDefault();
  col.classList.remove("drag-over");
  const id = e.dataTransfer.getData("text/plain");
  const t = byId("tasks", id);
  if(!t || t.status === col.dataset.kb) return;
  const old = t.status;
  t.status = col.dataset.kb;
  if(t.status==="Done") t.completedDate = Date.now(); else delete t.completedDate;
  logAct("Status changed","tasks",`${t.title}: ${old} → ${t.status}`);
  saveState(); toast(`“${t.title.slice(0,30)}” → ${t.status}`);
  const body = $("#coll-body"); if(body) body.innerHTML = tasksBody();
});

function searchAll(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const out = [];
  COLLECTIONS.forEach(coll=>{
    (state[coll]||[]).forEach(it=>{
      const hay = [it.title||it.name, it.description, it.keyword, it.content, it.decision, it.findings, (it.tags||[]).join(" ")].filter(Boolean).join(" ").toLowerCase();
      if(hay.includes(q)) out.push({coll, it});
    });
  });
  return out.slice(0, 40);
}
function handleGlobalSearch(q){
  const panel = $("#gsearch-panel");
  ui.gsOpen = true;
  if(!q.trim()){ panel.hidden = true; return; }
  const res = searchAll(q).slice(0,8);

function doImport(file){

      if(!data || typeof data !== "object" || !Array.isArray(data.projects)) throw new Error("Not a YallaBuy Project OS export");
      confirmDlg("Import data?", "This will REPLACE your current workspace with the imported file. Export first if you need a backup.", ()=>{
        state = data;
        ["projects","tasks","ideas","content","features","seo","bugs","notes","research","goals","decisions","reviews","activity","tags"].forEach(k=>{ if(!Array.isArray(state[k])) state[k]=[]; });
        if(!state.settings) state.settings = {};
        saveState(); applyTheme(); closeModal(); rerender(); toast("Import successful.");
      });
    }catch(err){ toast("Import failed: " + err.message, "err"); }
  };
  reader.onerror = () => toast("Could not read that file.","err");
  reader.readAsText(file);

  const navEl = e.target.closest("[data-nav]");
  if(navEl){ location.hash = "#/" + navEl.dataset.nav; closeMenus(); return; }
  const el = e.target.closest("[data-action]");
  // close menus when clicking elsewhere
  if(!e.target.closest(".qa-wrap")) $("#qa-menu").hidden = true;
  if(!e.target.closest(".gsearch")){ $("#gsearch-panel").hidden = true; ui.gsOpen = false; }
  if(!el) return;
  const act = el.dataset.action, ref = el.dataset.ref || "";
  switch(act){
    case "theme": state.settings.theme = state.settings.theme==="dark"?"light":"dark"; saveState(); applyTheme(); break;
    case "set-theme": state.settings.theme = ref; saveState(); applyTheme(); vSettings(); break;
    case "open-side": openSidebar(); break;
    case "close-side": closeSidebar(); break;
    case "close-modal": closeModal(); break;
    case "quickadd": { const m = $("#qa-menu"); m.hidden = !m.hidden;
      if(!m.hidden && !m.dataset.built){ buildQuickAdd(); m.dataset.built = "1"; } break; }
    case "add": openForm(el.dataset.coll); break;
    case "qa-add": $("#qa-menu").hidden = true; openForm(ref); break;
    case "edit": { const [c,id] = ref.split(":"); openForm(c, id); break; }
    case "del": { const [c,id] = ref.split(":"); deleteItem(c, id); break; }
    case "view": { const [c,id] = ref.split(":"); if(byId(c,id)) openDetail(c,id); break; }
    case "toggle-done": {
      const t = byId("tasks", ref); if(!t) break;
      t.status = t.status==="Done" ? "Todo" : "Done";
      if(t.status==="Done") t.completedDate = Date.now(); else delete t.completedDate;
      logAct("Completed","tasks",t.title); saveState(); closeModal(); rerender(); toast(t.status==="Done"?"Task completed. 🎉".replace(" 🎉","") : "Task reopened.");
      break; }
    case "task-view": ui.taskView = ref; vTasks(); break;
    case "seo-tab": ui.seoTab = ref; vSeo(); break;
    case "goal-tab": ui.goalTab = ref; vGoals(); break;
    case "goto-search": location.hash = "#/search"; $("#gsearch-panel").hidden = true;
      setTimeout(()=>{ const pi=$("#page-search"); if(pi){ pi.value = $("#gsearch-input").value; ui.searchQ = pi.value; renderSearchResults(); } },30);
      break;
    case "del-review": confirmDlg("Delete this review?","Saved weekly reviews are permanent history — this cannot be undone.",()=>{
        state.reviews = state.reviews.filter(r=>r.id!==ref); saveState(); closeModal(); vReview(); toast("Review deleted."); });
      break;
    case "convert": {
      const d = byId("research", currentDetailId());
      if(!d) break;
      const now = Date.now();
      if(ref==="ideas") saveItem("ideas",{title:d.title, description:d.conclusion||d.findings||"", status:"Inbox", impact:3, importance:3, urgency:3, effort:3, priority:"Medium", projectId:d.projectId||""});
      if(ref==="tasks") saveItem("tasks",{title:d.title, description:d.conclusion||"", status:"Todo", priority:"Medium", projectId:d.projectId||"", tags:[]});
      if(ref==="decisions") saveItem("decisions",{title:d.title, decision:d.conclusion||"", reason:d.findings||"", alternatives:"", status:"Proposed", projectId:d.projectId||""});
      if(ref==="notes") saveItem("notes",{title:d.title, content:[d.findings,d.conclusion].filter(Boolean).join("\n\n"), category:"Research", tags:[], projectId:d.projectId||""});
      closeModal(); rerender();
      break; }
    case "export": doExport(); break;
    case "import": $("#import-file").click(); break;
    case "reset-demo": confirmDlg("Reset to demo data?","ALL your current data will be replaced with the original YallaBuy demo set. Export a backup first if unsure.",()=>{
        state = seedData(); saveState(); applyTheme(); closeModal(); rerender(); toast("Demo data restored."); });
      break;
  }
});
/* remember which detail is open for "convert" */
let _detailId = null;
const _openDetail = openDetail;
openDetail = function(coll, id){ _detailId = id; _openDetail(coll, id); };
function currentDetailId(){ return _detailId; }
/* keyboard activate rows */
document.addEventListener("keydown", e=>{

});
 $("#import-file").addEventListener("change", e=>{
  if(e.target.files[0]) doImport(e.target.files[0]);

});
document.addEventListener("click", e=>{
  if(e.target.closest("#gsearch-input") && $("#gsearch-input").value) handleGlobalSearch($("#gsearch-input").value);
});
window.addEventListener("error", ()=>{ /* never let one error kill the UI silently */ });

   <!-- تسجيل Service Worker + تحديث تلقائي -->
<script>
  (function() {
    if (!('serviceWorker' in navigator)) return;

    let refreshing = false;

    // عندما يتحكم Service Worker جديد
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });

    navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
      console.log('✅ Service Worker مسجل');

      reg.addEventListener('updatefound', function() {
        const newWorker = reg.installing;

        newWorker.addEventListener('statechange', function() {
          // لو فيه SW قديم شغال → فيه تحديث جديد
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('🔄 تحديث جديد متاح!');
            
            // أرسل رسالة للتحديث فوراً
            newWorker.postMessage('skipWaiting');
          }
        });
      });
    }).catch(function(err) {
      console.log('❌ فشل التسجيل:', err);
    });
  })();
</script>
