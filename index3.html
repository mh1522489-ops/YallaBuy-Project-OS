<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THØR Weather</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f8f3eb;
      color: #292820;
    }

    .weather-card {
      max-width: 360px;
      margin: 40px auto;
      padding: 24px;
      border: 1px solid #e5dbcd;
      border-radius: 20px;
      background: #fffdf9;
    }

    h1 {
      font-size: 22px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #c65e3d;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      font-size: 14px;
      line-height: 1.6;
    }

    #temperature {
      font-size: 48px;
      margin: 20px 0 8px;
    }
  </style>
</head>

<body>
  <main class="weather-card">
    <h1>Local Weather</h1>
    <p>Check the weather at your current location.</p>

    <button id="location-btn">
      Use my current location
    </button>

    <p id="status" role="status" aria-live="polite">
      Press the button to get started.
    </p>

    <section id="weather" hidden>
      <div id="temperature"></div>
      <p id="details"></p>
    </section>
  </main>

  <script>
    const button = document.querySelector("#location-btn");
    const status = document.querySelector("#status");
    const weather = document.querySelector("#weather");
    const temperature = document.querySelector("#temperature");
    const details = document.querySelector("#details");

    button.addEventListener("click", () => {
      if (!navigator.geolocation) {
        status.textContent =
          "Your browser does not support location access.";
        return;
      }

      button.disabled = true;
      status.textContent = "Getting your location...";
      weather.hidden = true;

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;

          try {
            status.textContent = "Loading weather data...";

            const params = new URLSearchParams({
              latitude,
              longitude,
              current:
                "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m",
              timezone: "auto"
            });

            const response = await fetch(
              `https://api.open-meteo.com/v1/forecast?${params}`
            );

            if (!response.ok) {
              throw new Error("Weather request failed");
            }

            const data = await response.json();
            const current = data.current;

            temperature.textContent =
              `${Math.round(current.temperature_2m)}°C`;

            details.textContent =
              `Feels like ${Math.round(current.apparent_temperature)}°C · ` +
              `Humidity ${current.relative_humidity_2m}% · ` +
              `Wind ${current.wind_speed_10m} km/h`;

            weather.hidden = false;
            status.textContent = "Weather updated successfully.";
          } catch (error) {
            status.textContent =
              "Could not load weather. Please try again.";
            console.error(error);
          } finally {
            button.disabled = false;
          }
        },

        (error) => {
          const messages = {
            1: "Location permission was denied. Allow access or choose a city manually.",
            2: "Your location is unavailable. Please try again.",
            3: "Location request timed out. Please try again."
          };

          status.textContent =
            messages[error.code] || "Could not get your location.";

          button.disabled = false;
        },

        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 300000
        }
      );
    });
  </script>
</body>
</html>
